<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sons — Lab de Armas — SHADOW OPS</title>
<link rel="stylesheet" href="src/styles/main.css">
<link rel="stylesheet" href="src/styles/sons.css">
</head>
<body class="sons">
<header class="sons-h">
  <h1>SONS</h1>
  <p class="hint">Escute cada som do pacote e escolha para onde ele vai. <b>Aplicar no jogo</b> troca o som do jogo na hora (o anterior fica guardado e dá para desfazer).</p>
  <nav><a href="lab.html">← Lab de Armas</a> <a href="index.html">Jogo</a></nav>
</header>

<section class="bar">
  <label>Pacote <select id="pack"></select></label>
  <label>Procurar <input id="filter" placeholder="nome do som…"></label>
  <label class="chk"><input type="checkbox" id="onlyFree"> só os que ainda não têm destino</label>
  <label>Volume <input type="range" id="vol" min="0" max="1" step=".05" value=".8"></label>
  <span class="keys">↑ ↓ escolhe e toca · Espaço toca de novo · Enter aplica</span>
</section>

<main id="list"><p class="hint">Carregando a lista de sons…</p></main>

<footer id="foot">
  <span id="msg"></span>
  <span id="summary"></span>
</footer>

<script type="module" src="src/lab/Sons.js"></script>
</body>
</html>
